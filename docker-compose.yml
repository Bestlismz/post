name: rental-radar

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_radar
      POSTGRES_USER: rental_radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_radar -d rental_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set RUNTIME_DATABASE_URL using rental_radar_web and host postgres}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to at least 32 characters}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-}
      META_TOKEN_KEYS: ${META_TOKEN_KEYS:-{}}
      META_TOKEN_KEY_VERSION: ${META_TOKEN_KEY_VERSION:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: .
    init: true
    restart: unless-stopped
    command: ["node", "src/worker.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${WORKER_DATABASE_URL:?Set WORKER_DATABASE_URL using rental_radar_worker and host postgres}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      META_TOKEN_KEYS: ${META_TOKEN_KEYS:-{}}
      META_TOKEN_KEY_VERSION: ${META_TOKEN_KEY_VERSION:-}
    networks:
      - backend

volumes:
  postgres-data:
    name: rental-radar-postgres-data
  # Reserved for the Groups runtime. Only its browser may mount this volume.
  browser-profile:
    name: rental-radar-browser-profile

networks:
  backend:
    name: rental-radar-backend
  # Future browser service joins this network only and receives no DB/Meta credentials.
  browser:
    name: rental-radar-browser
