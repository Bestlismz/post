name: rental-radar

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_radar
      POSTGRES_USER: rental_radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_radar -d rental_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate && exec npm start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL using host postgres}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to at least 32 characters}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
    name: rental-radar-postgres-data
  # Reserved for the Groups runtime. Only its browser may mount this volume.
  browser-profile:
    name: rental-radar-browser-profile

networks:
  backend:
    name: rental-radar-backend
  # Future browser service joins this network only and receives no DB/Meta credentials.
  browser:
    name: rental-radar-browser
