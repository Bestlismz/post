name: rental-radar

services:
  secrets:
    build: .
    user: "0:0"
    restart: "no"
    entrypoint: ["node", "scripts/ensure-compose-secrets.mjs"]
    environment:
      POSTGRES_DB: rental_radar
      POSTGRES_USER: rental_radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:-}
      RUNTIME_DATABASE_URL: ${RUNTIME_DATABASE_URL:-}
      WORKER_DATABASE_PASSWORD: ${WORKER_DATABASE_PASSWORD:-}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      META_TOKEN_KEY_VERSION: ${META_TOKEN_KEY_VERSION:-}
      META_TOKEN_KEYS: '${META_TOKEN_KEYS:-{}}'
      GROUP_COMMAND_KEY_ID: ${GROUP_COMMAND_KEY_ID:-}
      GROUP_COMMAND_KEYS: '${GROUP_COMMAND_KEYS:-{}}'
    volumes:
      - database-secrets:/run/rendar-db
      - runtime-secrets:/run/rendar

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: rental_radar
      POSTGRES_USER: rental_radar
      POSTGRES_PASSWORD_FILE: /run/rendar-db/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - database-secrets:/run/rendar-db:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_radar -d rental_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  bootstrap:
    build: .
    init: true
    restart: "no"
    depends_on:
      secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/scripts/compose-entrypoint.sh"]
    command: ["node", "scripts/bootstrap-compose.mjs"]
    environment:
      RENDAR_DATABASE_ROLE: owner
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@naina.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Naina Admin}
      BOOTSTRAP_SAMPLE_DATA: ${BOOTSTRAP_SAMPLE_DATA:-true}
    volumes:
      - database-secrets:/run/rendar-db:ro
      - runtime-secrets:/run/rendar:ro
    networks:
      - backend

  web:
    build: .
    init: true
    stop_grace_period: 120s
    restart: unless-stopped
    command: ["node", "src/server.mjs"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/app/scripts/compose-entrypoint.sh"]
    environment:
      NODE_ENV: production
      RENDAR_DATABASE_ROLE: web
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      OPENAI_PROVIDER_CONFIGURED: ${OPENAI_API_KEY:+true}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v24.0}
      GROUP_SUPPORTED_SELECTOR_VERSIONS: ${GROUP_SUPPORTED_SELECTOR_VERSIONS:-facebook-dom-v3}
      GROUP_SCHEDULER_TEST_CADENCE_MS: ${GROUP_SCHEDULER_TEST_CADENCE_MS:-}
      GROUP_WORKER_URL: http://group-worker:3001
      STAGING_FACEBOOK_SEND: ${STAGING_FACEBOOK_SEND:-false}
      STAGING_FACEBOOK_SOURCE_ALLOWLIST: ${STAGING_FACEBOOK_SOURCE_ALLOWLIST:-}
      GROUP_RECOVERY_PROXY_URL: http://group-worker:6081
    volumes:
      - runtime-secrets:/run/rendar:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - backend
      - browser
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: .
    init: true
    stop_grace_period: 120s
    restart: unless-stopped
    command: ["node", "src/worker.mjs"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/app/scripts/compose-entrypoint.sh"]
    environment:
      NODE_ENV: production
      RENDAR_DATABASE_ROLE: worker
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      GROUP_SUPPORTED_SELECTOR_VERSIONS: ${GROUP_SUPPORTED_SELECTOR_VERSIONS:-facebook-dom-v3}
      GROUP_SCHEDULER_POLL_MS: ${GROUP_SCHEDULER_POLL_MS:-15000}
      GROUP_SCHEDULER_TEST_CADENCE_MS: ${GROUP_SCHEDULER_TEST_CADENCE_MS:-}
      GROUP_SCHEDULER_BATCH_SIZE: ${GROUP_SCHEDULER_BATCH_SIZE:-50}
      GROUP_SCHEDULER_TICK_TIMEOUT_MS: ${GROUP_SCHEDULER_TICK_TIMEOUT_MS:-30000}
      GROUP_WORKER_URL: http://group-worker:3001
      STAGING_FACEBOOK_SEND: ${STAGING_FACEBOOK_SEND:-false}
      STAGING_FACEBOOK_SOURCE_ALLOWLIST: ${STAGING_FACEBOOK_SOURCE_ALLOWLIST:-}
    volumes:
      - runtime-secrets:/run/rendar:ro
    networks:
      - backend
      - browser

  group-worker:
    build:
      context: .
      dockerfile: Dockerfile.group-worker
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    command: ["/usr/bin/supervisord", "-c", "/app/supervisord.conf"]
    depends_on:
      secrets:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/app/scripts/compose-entrypoint.sh"]
    environment:
      NODE_ENV: production
      RENDAR_DATABASE_ROLE: none
      PORT: 3001
      DISPLAY: :99
      CHROME_CDP_URL: http://127.0.0.1:9222
      BROWSER_PROFILE_PATH: /data/chromium
      GROUP_OPERATION_LEDGER_PATH: /data/group-operations
      GROUP_SOURCE_ALLOWLIST: ${GROUP_SOURCE_ALLOWLIST:-}
      GROUP_SUPPORTED_SELECTOR_VERSIONS: ${GROUP_SUPPORTED_SELECTOR_VERSIONS:-facebook-dom-v3}
      STAGING_FACEBOOK_SEND: ${STAGING_FACEBOOK_SEND:-false}
      STAGING_FACEBOOK_SOURCE_ALLOWLIST: ${STAGING_FACEBOOK_SOURCE_ALLOWLIST:-}
    volumes:
      - runtime-secrets:/run/rendar:ro
      - browser-profile:/data/chromium
      - group-operations:/data/group-operations
    networks:
      - browser
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(async r=>{const b=await r.json();process.exit(r.status===200&&b.ok===true&&['healthy','busy'].includes(b.session?.state)?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  staging-check:
    profiles: ["tools"]
    build: .
    init: true
    depends_on:
      secrets:
        condition: service_completed_successfully
      group-worker:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/scripts/compose-entrypoint.sh"]
    command: ["node", "scripts/staging-facebook-check.mjs", "--no-send"]
    environment:
      RENDAR_DATABASE_ROLE: none
      GROUP_WORKER_URL: http://group-worker:3001
      GROUP_SOURCE_ALLOWLIST: ${GROUP_SOURCE_ALLOWLIST:-}
      STAGING_FACEBOOK_SEND: ${STAGING_FACEBOOK_SEND:-false}
      STAGING_FACEBOOK_SOURCE_ALLOWLIST: ${STAGING_FACEBOOK_SOURCE_ALLOWLIST:-}
    volumes:
      - runtime-secrets:/run/rendar:ro
    networks:
      - browser

volumes:
  database-secrets:
    name: ${DATABASE_SECRETS_VOLUME:-rental-radar-database-secrets}
  runtime-secrets:
    name: ${RUNTIME_SECRETS_VOLUME:-rental-radar-runtime-secrets}
  postgres-data:
    name: ${POSTGRES_VOLUME:-rental-radar-postgres-data}
  browser-profile:
    name: ${BROWSER_PROFILE_VOLUME:-rental-radar-browser-profile}
  group-operations:
    name: ${GROUP_OPERATIONS_VOLUME:-rental-radar-group-operations}

networks:
  backend:
    name: ${BACKEND_NETWORK:-rental-radar-backend}
  browser:
    name: ${BROWSER_NETWORK:-rental-radar-browser}
